<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>中环幕墙光路</title>
  <meta name="description" content="中环街谷的单时刻幕墙反射光路。真实 OSM 轮廓和高度，可看多跳。不是 SJG 188 评估软件。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@430;620;760&family=Noto+Serif+SC:wght@650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/city.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view" aria-label="中环三维街谷和反射光路。单指旋转，双指缩放和平移。"></canvas>
  <p id="boot">正在装载中环建筑…</p>

  <header class="top">
    <p class="kicker">港岛中环 · 单时刻</p>
    <h1>幕墙光路</h1>
    <p class="lead" id="path-readout">光路计算中。</p>
  </header>

  <aside class="panel" id="panel">
    <form id="controls">
      <label class="field">
        <span>评估楼</span>
        <select id="building"></select>
      </label>
      <p class="meta" id="building-meta"></p>

      <div class="modes" role="radiogroup" aria-label="光路显示">
        <button type="button" role="radio" id="mode-street" aria-checked="false">只看街</button>
        <button type="button" role="radio" id="mode-reflect" aria-checked="true">单纯看反射</button>
      </div>
      <p class="fine" id="mode-hint"></p>

      <label class="slider">
        <span class="row"><span>倾角 α</span><b id="alpha-val">24°</b></span>
        <input id="alpha" type="range" min="0" max="50" step="0.5" value="24">
      </label>
      <label class="slider">
        <span class="row"><span>日期</span><b id="date-val">12月21日</b></span>
        <input id="doy" type="range" min="1" max="365" step="1" value="355">
      </label>
      <label class="slider">
        <span class="row"><span>时刻</span><b id="time-val">10:00</b></span>
        <input id="clock" type="range" min="360" max="1110" step="10" value="600">
      </label>
      <label class="slider">
        <span class="row"><span>反射比 ρ</span><b id="rho-val">0.30</b></span>
        <input id="rho" type="range" min="0.08" max="0.40" step="0.01" value="0.30">
      </label>

      <div class="checks">
        <label><input id="hop2" type="checkbox" checked> 二跳</label>
        <label><input id="incoming" type="checkbox" checked> 入射</label>
        <button type="button" id="frame" class="textish">对准这条光路</button>
      </div>

      <p class="sunline" id="sun-readout"></p>
      <p class="counts" id="counts"></p>

      <ul class="legend">
        <li><i style="background:#f0c14b"></i>入射</li>
        <li><i style="background:#e25a12"></i>落到街</li>
        <li><i style="background:#c4496a"></i>邻楼玻璃</li>
        <li><i style="background:#1f8f86"></i>天空</li>
        <li><i style="background:#2f6fbe"></i>水面</li>
      </ul>
      <p class="fine">冷色：OSM / 公开数据 / Wikidata 高度。暖色：层数或默认推断（标「高度推断」）。缺高度已尽量补全，omittedNoHeight 目标为 0。</p>
      <p class="ratio" id="ratio"></p>

      <details class="history">
        <summary>只读历史仿真</summary>
        <p>早前对另外几组参数化楼跑过全年扫描。那些数字不在这页上改，这页的中环光路也不拿来下全年结论。</p>
      </details>
    </form>
    <p class="legal">几何预览，不是 SJG 188 专业评估，也不是结构验算。反射 r = 2(n·s)n − s。建筑 © OpenStreetMap 贡献者，ODbL。</p>
  </aside>
  <script type="module" src="js/main.js"></script>
</body>
</html>
